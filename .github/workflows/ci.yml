# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
# --- CH-08: Automatización de Publicación de Imágenes (GHCR). ---
permissions:
  contents: read
  packages: write
# -----------------
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Analisis con SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=roberth1982trujillo -Dsonar.projectKey=roberth1982trujillo_Notificacion-Service
    - name: Construir imagen Docker localmente
      run: docker build -t notificacion-service:latest .
    - name: Escaneo de vulnerabilidades con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'notificacion-service:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
# --- CH-08: Automatización de Publicación de Imágenes (GHCR). ---
    - name: Iniciar sesión en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Etiquetar imagen para GHCR
      run: docker tag notificacion-service:latest ghcr.io/roberth1982trujillo/notificacion-service:latest

    - name: Subir imagen a GHCR
      run: docker push ghcr.io/roberth1982trujillo/notificacion-service:latest
